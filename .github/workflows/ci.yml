name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: collector-agent

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build collector image
        uses: docker/build-push-action@v6
        with:
          context: collector-agent
          load: true
          tags: cloudpulse-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max
      - name: Enforce image size budget (<15MB)
        run: |
          size=$(docker image inspect cloudpulse-collector:ci --format '{{.Size}}')
          echo "collector image: $size bytes"
          test "$size" -lt 15000000
      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: control-plane
          tags: cloudpulse-control-plane:ci
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,scope=control-plane,mode=max
      - name: Validate compose file
        run: docker compose -f deployments/docker-compose.yml config -q

