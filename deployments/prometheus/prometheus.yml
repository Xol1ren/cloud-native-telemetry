global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: collector-agent
    static_configs:
      - targets: ["collector:9100"]

  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["control-plane:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

